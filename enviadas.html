<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Enviadas</title>

<link rel="stylesheet" href="style.css">

<style>

body.modal-open{
overflow:hidden;
}

</style>

</head>

<body>

<div class="contenedor">

<div class="contenido-enviadas">

<h2 id="fechaHoy"></h2>

<div class="buscador">

<input type="text" id="inputFecha" placeholder="dd/mm/yyyy">

<button onclick="buscarFecha()">Buscar</button>

<button onclick="cargar()">Hoy</button>

</div>

<table class="tabla">

<thead>

<tr>
<th>Fecha</th>
<th>Ticket</th>
<th>Hora</th>
<th>Importe</th>
</tr>

</thead>

<tbody id="tablaTickets"></tbody>

</table>

<div class="volver">

<button onclick="window.location='index.html'">VOLVER</button>

</div>

</div>

</div>

<!-- MODAL -->
<div id="modalTicket" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000cc;
">

<div style="
background:white;
width:85%;
margin:40px auto;
padding:20px;
border-radius:10px;
max-height:80vh;
overflow:auto;
">

<h2>DETALLE DEL TICKET</h2>

<table class="tabla">

<thead>

<tr>
<th>Lotería</th>
<th>Número</th>
<th>Pos</th>
<th>Importe</th>
</tr>

</thead>

<tbody id="detalleTicket"></tbody>

</table>

<br>

<button onclick="reimprimirTicket()" class="btn-cerrar">
Reimprimir
</button>

<button onclick="cerrarModal()" class="btn-cerrar">
Cerrar
</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyA2y91gOWX_Or_UNuilOhWmBVPS0vmQSE",
authDomain: "quni-ba5f7.firebaseapp.com",
projectId: "quni-ba5f7",
storageBucket: "quni-ba5f7.firebasestorage.app",
messagingSenderId: "140436996650",
appId: "1:140436996650:web:044d67a93205b244f87953"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let ticketsGlobal = [];
let ticketActual = null;

async function cargar(fechaFiltro = null){

const tabla = document.getElementById('tablaTickets');
tabla.innerHTML = '';

const hoy = new Date().toLocaleDateString('es-AR');
const fechaBuscada = fechaFiltro || hoy;

document.getElementById('fechaHoy').innerText = 'Fecha: ' + fechaBuscada;

const q = query(collection(db, "tickets"), orderBy("fecha", "desc"));
const snapshot = await getDocs(q);

ticketsGlobal = [];

snapshot.forEach((doc) => {

const data = doc.data();
const fechaObj = data.fecha.toDate();

ticketsGlobal.push({

firebaseId: doc.id,
ticket: data.ticket,
fecha: fechaObj.toLocaleDateString('es-AR'),
hora: fechaObj.toLocaleTimeString('es-AR'),
jugadas: data.jugadas

});

});

const filtrados = ticketsGlobal.filter(t => t.fecha === fechaBuscada);

filtrados.forEach(t => {

let total = 0;
t.jugadas.forEach(j => total += Number(j.importe));

tabla.innerHTML += `
<tr>
<td>${t.fecha}</td>
<td><a href="#" onclick="verTicket('${t.firebaseId}')">#${t.ticket}</a></td>
<td>${t.hora}</td>
<td>${total}</td>
</tr>
`;

});

}

function buscarFecha(){
const fecha = document.getElementById('inputFecha').value;
cargar(fecha);
}

function verTicket(id){

const ticket = ticketsGlobal.find(t => t.firebaseId === id);
if(!ticket) return;

ticketActual = ticket;

const tabla = document.getElementById('detalleTicket');
tabla.innerHTML = '';

let total = 0;

let agrupadas = {};

ticket.jugadas.forEach(j => {

const clave = j.numero + '|' + j.posicion + '|' + j.importe;

if(!agrupadas[clave]){

agrupadas[clave] = {
loterias: [],
numero: j.numero,
posicion: j.posicion,
importe: Number(j.importe)
};

}

agrupadas[clave].loterias.push(j.loteria);

});

Object.values(agrupadas).forEach(j => {

total += j.importe;

tabla.innerHTML += `
<tr>
<td>${j.loterias.join(' ')}</td>
<td>${j.numero}</td>
<td>${j.posicion}</td>
<td>${j.importe}</td>
</tr>
`;

});

tabla.innerHTML += `
<tr>
<td colspan="3"><b>TOTAL</b></td>
<td><b>${total}</b></td>
</tr>
`;

document.getElementById('modalTicket').style.display = 'block';
document.body.classList.add('modal-open');

}

function reimprimirTicket(){

if(!ticketActual) return;

const fecha = new Date();

let contenido = '';
let total = 0;

ticketActual.jugadas.forEach(j => {
total += Number(j.importe);
});

contenido += `-------------------------------\n`;
contenido += `REIMPRESIÓN\n`;
contenido += `-------------------------------\n\n`;

ticketActual.jugadas.forEach(j => {

let numero = String(j.numero);
if(numero.length === 3) numero = '*' + numero;
if(numero.length === 2) numero = '**' + numero;
if(numero.length === 1) numero = '***' + numero;

const pos = String(j.posicion).padStart(2,'0');
const imp = Number(j.importe).toLocaleString('es-AR') + ',00';

contenido += `${numero.padEnd(8,' ')}${pos.padEnd(6,' ')}${imp}\n${j.loteria}\n\n`;

});

const w = window.open('', '', 'width=350,height=700');

w.document.write(`
<html>
<head>
<title>REIMPRESIÓN</title>

<style>

@page { size:58mm auto; margin:0; }

html,body{
width:58mm;
margin:0;
padding:0;
font-family:"Courier New", monospace;
font-size:15px;
}

pre{
white-space:pre-wrap;
margin:0;
padding:2px;
line-height:1.05;
}

</style>

</head>

<body>

<pre>
TICKET: ${ticketActual.ticket}

${fecha.toLocaleDateString('es-AR')} ${fecha.toLocaleTimeString('es-AR')}

${contenido}
-------------------------------
TOTAL: ${total.toLocaleString('es-AR')},00
</pre>

</body>
</html>
`);

w.document.close();
w.print();

}

function cerrarModal(){
document.getElementById('modalTicket').style.display = 'none';
document.body.classList.remove('modal-open');
}

window.buscarFecha = buscarFecha;
window.verTicket = verTicket;
window.cerrarModal = cerrarModal;
window.cargar = cargar;
window.reimprimirTicket = reimprimirTicket;

cargar();

</script>

</body>
</html>
